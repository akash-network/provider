---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: akash-services-default-deny-ingress
spec:
  podSelector:
    matchLabels: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: akash-services-allow-akash-services
spec:
  podSelector:
    matchLabels: {}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              akash.network/name: akash-services
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: akash-services-allow-gateway
spec:
  podSelector:
    matchLabels: {}
  ingress:
    # The gateway data plane runs in the Gateway's namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: akash-gateway
