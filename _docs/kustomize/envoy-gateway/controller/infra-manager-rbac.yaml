---
# Rendered by the gateway-helm chart only in GatewayNamespace mode: lets the
# controller manage proxy resources in each Gateway's namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eg-gateway-helm-cluster-infra-manager
  labels:
    app.kubernetes.io/name: gateway-helm
    app.kubernetes.io/instance: eg
rules:
  - apiGroups: [""]
    resources: [serviceaccounts, services, configmaps]
    verbs: [create, get, list, delete, deletecollection, patch, watch]
  - apiGroups: [apps]
    resources: [deployments, daemonsets]
    verbs: [create, get, list, delete, deletecollection, patch, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [create, get, list, delete, deletecollection, patch, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [create, get, list, delete, deletecollection, patch, watch]
  - apiGroups: [certificates.k8s.io]
    resources: [clustertrustbundles]
    verbs: [list, get, watch]
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eg-gateway-helm-cluster-infra-manager
  labels:
    app.kubernetes.io/name: gateway-helm
    app.kubernetes.io/instance: eg
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eg-gateway-helm-cluster-infra-manager
subjects:
  - kind: ServiceAccount
    name: envoy-gateway
    namespace: envoy-gateway-system
