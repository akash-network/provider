---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # NGINX Gateway Fabric deployment (NodePort variant)
  - https://raw.githubusercontent.com/nginx/nginx-gateway-fabric/v2.4.1/deploy/nodeport/deploy.yaml
  # Akash gateway resources (namespace + Gateway)
  - gateway.yaml
patches:
  - path: nodeport-patch.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: nginx-gateway
      namespace: nginx-gateway
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --snippets-filters
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRole
      name: nginx-gateway
    patch: |-
      - op: add
        path: /rules/-
        value:
          apiGroups: ["gateway.nginx.org"]
          resources: ["snippetsfilters"]
          verbs: ["list", "watch"]
      - op: add
        path: /rules/-
        value:
          apiGroups: ["gateway.nginx.org"]
          resources: ["snippetsfilters/status"]
          verbs: ["update"]
