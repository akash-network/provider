---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: operator-ip
  namespace: akash-services
  labels:
    app.kubernetes.io/name: ip
    app.kubernetes.io/instance: ip-service
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: provider
spec:
  parentRefs:
    - name: akash-gateway
      namespace: akash-gateway
      sectionName: http
  hostnames:
    - akash-operator-ip.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: operator-ip
          port: 8080
