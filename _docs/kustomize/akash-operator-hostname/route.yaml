---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: akash-hostname-operator
spec:
  parentRefs:
    - name: akash-gateway
      namespace: akash-gateway
      sectionName: http
  hostnames:
    - akash-hostname-operator.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: operator-hostname
          port: 8080
