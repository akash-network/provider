---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: akash-node
spec:
  parentRefs:
    - name: akash-gateway
      namespace: akash-gateway
      sectionName: http
  hostnames:
    - akash.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: akash-node
          port: 26657
